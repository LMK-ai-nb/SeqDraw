name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: MoonBit / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon check --target wasm-gc,js --deny-warn
      - run: moon test --target wasm-gc,js
      - run: moon fmt --check
      - name: Render the examples
        shell: bash
        run: |
          for f in examples/*.seq; do
            echo "--- $f"
            moon run cmd/main --target wasm-gc -- "$f"
          done
